name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" > /dev/null

      - name: Fetch packages
        run: flutter pub get

      - name: Build signed APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          body: |
            | 设备 | 下载 |
            | --- | --- |
            | 64 位手机（推荐） | [arm64-v8a](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-arm64-v8a-release.apk) |
            | 32 位手机 | [armeabi-v7a](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-armeabi-v7a-release.apk) |
            | 模拟器 | [x86_64](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-x86_64-release.apk) |
            | 通用 | [universal](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk) |
