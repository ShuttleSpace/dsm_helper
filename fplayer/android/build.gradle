group 'com.flutterplayer.fplayer'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 33
    namespace 'com.flutterplayer.fplayer'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }
}

dependencies {
    implementation("com.befovy.fijkplayer:fijkplayer-full:0.7.15")
    // implementation(name: 'fijkplayer-full-release', ext: 'aar')
    // fijkplayer-full include the java lib and native shared libs for armv5 armv7 arm64 x86 x86_64
//    implementation 'io.github.flutterplayer:fplayer-core:1.0.0'
    implementation 'androidx.annotation:annotation:1.2.0'
}
